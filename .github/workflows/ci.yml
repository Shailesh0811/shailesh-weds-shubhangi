name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, dev, prod ]

env:
  NODE_VERSION: '20'

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting (non-blocking)
      run: npm run lint || echo "Linting completed with warnings/errors - continuing CI"

    - name: Run tests (non-blocking)
      run: npm run test -- --watch=false --browsers=ChromeHeadless || echo "Tests completed with failures - continuing CI"

    - name: Build development version
      run: npm run build:dev

    - name: Build production version
      run: npm run build:prod

    - name: Check build artifacts
      run: |
        echo "Checking build artifacts..."
        ls -la dist/shailesh-weds-shubhangi/
        echo "Build completed successfully!"
